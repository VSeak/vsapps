<header class="top">
  <a class="brand" href="#/"><svg viewBox="0 0 32 32" aria-hidden="true"><path d="M15.5 27 12 22.5l-5.5-3-4.5-2 .6-5L7.5 9 12 7l2.5-3 4.5-1 3 2.5 4 1 2 5 2.5 4.5-.5 11z" fill="currentColor"/><rect x="1.5" y="24.2" width="9" height="2.8" rx=".9" fill="currentColor"/></svg><span class="brand-text"><b class="brand-name"></b><small class="brand-sub"></small></span></a>
  <div class="who" hidden><span id="whoName"></span><span id="whoRoles"></span></div>

</header>
<div id="installBar" hidden><img src="apple-touch-icon.png" alt=""><p></p>
  <div class="install-btns"><button type="button" class="ghost small" data-install="later">Not Now</button><button type="button" class="primary small" data-install="go" hidden>Install</button></div></div>
<main id="app"></main>
<div id="unsavedBar" role="status" hidden><span></span>
  <div class="row"><button type="button" data-bar="show">Show</button><button type="button" class="primary" data-bar="save"></button></div></div>

<dialog id="dlg"></dialog>
