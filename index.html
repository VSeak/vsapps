<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Home</title>
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600&family=Inter:wght@400;500&family=DM+Sans:opsz,wght@9..40,400;9..40,700&family=Sora:wght@600&family=Space+Grotesk:wght@700&family=Figtree:wght@400;700&family=Outfit:wght@700&family=IBM+Plex+Sans:wght@400&family=DM+Serif+Display&family=Karla:wght@400&display=swap" rel="stylesheet">
<style>
/* Home: midnight blue and crimson. Each card wears its own app's colors. */
:root {
  --bg: #F4F5FA; --ink: #121A3D; --muted: #555E80; --line: #DADDEB; --accent: #8E0B2C;
  /* Sit Start: moss on warm sand */
  --ss-card: #FFFDF9; --ss-ink: #2C2620; --ss-muted: #766B60; --ss-line: #E1DAD0; --ss-accent: #4F6441;
  /* Top Out: chalk, navy, rope orange */
  --to-card: #F7F5F0; --to-ink: #1B2340; --to-muted: #5E6680; --to-line: #E2DED3; --to-accent: #E8622C; --to-accent-text: #B8431A;
  /* FIRE: ink and ember */
  --fi-card: #171A21; --fi-ink: #F6F3EE; --fi-muted: #A6AAB4; --fi-line: #2A2E36; --fi-accent: #FF6B35; --fi-gold: #FFC857;
  /* Kiddo Draw: pine and cranberry */
  --xm-card: #1E3B2F; --xm-ink: #F7F3EC; --xm-muted: #AFC2B7; --xm-line: #2C4E3F; --xm-accent: #E5566B; --xm-gold: #F2C14E;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0A0F24; --ink: #E9ECF7; --muted: #9CA3C2; --line: #232A4A; --accent: #C8163F;
    --ss-card: #201C17; --ss-ink: #ECE5DB; --ss-muted: #A69A8B; --ss-line: #352F27; --ss-accent: #A4BA8F;
    --to-card: #181C2C; --to-ink: #EDEFF5; --to-muted: #9AA1B8; --to-line: #2A3048; --to-accent: #FF8A4C; --to-accent-text: #FFA877;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0A0F24; --ink: #E9ECF7; --muted: #9CA3C2; --line: #232A4A; --accent: #C8163F;
  --ss-card: #201C17; --ss-ink: #ECE5DB; --ss-muted: #A69A8B; --ss-line: #352F27; --ss-accent: #A4BA8F;
  --to-card: #181C2C; --to-ink: #EDEFF5; --to-muted: #9AA1B8; --to-line: #2A3048; --to-accent: #FF8A4C; --to-accent-text: #FFA877;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html { background: var(--bg); }
body { margin: 0; padding: 0 env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left); background: var(--bg); color: var(--ink); font: 15px/1.5 Inter, system-ui, sans-serif; }
main { max-width: 820px; margin: 0 auto; padding: 3rem 16px; }
h1 { display: inline-block; font: 600 2.4rem/1.1 Fraunces, Georgia, serif; margin: 0 0 .5rem; }
h1::after { content: ""; display: block; width: 100%; height: 4px; border-radius: 2px; background: var(--accent); margin-top: .7rem; }
.muted { color: var(--muted); margin: 0; }
.apps { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 1rem; margin-top: 2rem; }
.app[hidden] { display: none; }
.app { display: block; background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 1.1rem;
  color: var(--ink); text-decoration: none; transition: border-color .15s, transform .15s; }
.app:hover { border-color: var(--accent); transform: translateY(-2px); }
.app:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
.app p { margin: 0; color: var(--muted); }
.app .brand { display: flex; align-items: center; gap: .65rem; margin-bottom: .7rem; }
.app .brand svg { width: 38px; height: 38px; flex: none; }
.app .brand h2 { margin: 0; white-space: nowrap; }
.sitstart { --card: var(--ss-card); --ink: var(--ss-ink); --muted: var(--ss-muted); --line: var(--ss-line); --accent: var(--ss-accent);
  font-family: "DM Sans", Inter, sans-serif; }
.sitstart .brand svg { color: var(--accent); }
.sitstart .brand h2 { font: 600 1.25rem/1.05 Sora, sans-serif; }
.topout { --card: var(--to-card); --ink: var(--to-ink); --muted: var(--to-muted); --line: var(--to-line); --accent: var(--to-accent);
  font-family: Figtree, Inter, sans-serif; border-top: 4px solid var(--to-accent); }
.topout .brand svg { color: var(--ink); }
.topout .brand .flag { fill: var(--accent); }
.topout .brand path[stroke] { stroke: var(--accent); }
.topout .brand h2 { font: 700 1.25rem/1 "Space Grotesk", sans-serif; letter-spacing: -.02em; }
.app .sub { display: block; white-space: nowrap; font-size: .7rem; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; margin-top: .2rem; }
.sitstart .sub { color: var(--ss-accent); }
.topout .sub { color: var(--to-accent-text); }
.sitstart { border-top: 4px solid var(--ss-accent); }
/* FIRE: an ink card in both themes, an ember-to-gold line on top */
.fire { --card: var(--fi-card); --ink: var(--fi-ink); --muted: var(--fi-muted); --line: var(--fi-line); --accent: var(--fi-accent);
  font-family: "IBM Plex Sans", Inter, sans-serif; border-top: 0; position: relative; overflow: hidden; }
.fire::before { content: ""; position: absolute; inset: 0 0 auto; height: 4px; background: linear-gradient(90deg, var(--fi-accent), var(--fi-gold)); }
.fire .brand .flame { fill: var(--fi-accent); }
.fire .brand .core { fill: var(--fi-gold); }
.fire .brand h2 { font: 700 1.3rem/1 Outfit, sans-serif; letter-spacing: .04em; }
.fire .sub { color: var(--fi-gold); letter-spacing: .06em; }   /* tighter so "Financial Independence" stays on one line and the cards keep one height */
/* Kiddo Draw: a pine card in both themes, a candy-cane line on top */
.xmas { --card: var(--xm-card); --ink: var(--xm-ink); --muted: var(--xm-muted); --line: var(--xm-line); --accent: var(--xm-accent);
  font-family: Karla, Inter, sans-serif; position: relative; overflow: hidden; }
.xmas::before { content: ""; position: absolute; inset: 0 0 auto; height: 4px; background: repeating-linear-gradient(-45deg, var(--xm-accent) 0 8px, var(--xm-ink) 8px 16px); }
.xmas .brand .box { fill: #D23A50; }
.xmas .brand .lid { fill: var(--xm-accent); }
.xmas .brand .ribbon { fill: var(--xm-gold); }
.xmas .brand h2 { font: 400 1.4rem/1 "DM Serif Display", serif; }
.xmas .sub { color: var(--xm-gold); }
</style>
</head>
<body>
<main>
  <h1>Welcome</h1>
  <p class="muted">Pick where you're headed.</p>
  <!-- One card per app. Each app lives in its own folder; its card uses that app's colors and fonts. -->
  <div class="apps">
    <a class="app sitstart" href="sitstart/">
      <div class="brand">
        <svg viewBox="0 0 32 32" aria-hidden="true"><path d="M15.5 27 12 22.5l-5.5-3-4.5-2 .6-5L7.5 9 12 7l2.5-3 4.5-1 3 2.5 4 1 2 5 2.5 4.5-.5 11z" fill="currentColor"/><rect x="1.5" y="24.2" width="9" height="2.8" rx=".9" fill="currentColor"/></svg>
        <div><h2>Sit Start</h2><span class="sub">Personal Coaching</span></div>
      </div>
      <p>Train with a plan.</p>
    </a>
    <a class="app topout" href="topout/">
      <div class="brand">
        <svg viewBox="0 0 32 32" aria-hidden="true"><path d="M2.5 28 8 16.5l4.5-3.5 3.5 2 4.5-6 4 4.5L29.5 28z" fill="currentColor"/><path d="M20.5 9V2.5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/><path class="flag" d="M21.4 2.6 27 4.4l-5.6 1.9z" fill="currentColor"/></svg>
        <div><h2>Top Out</h2><span class="sub">Adult Team</span></div>
      </div>
      <p>Run the team.</p>
    </a>
    <!-- FIRE is private: hidden unless the FIRE app has seen the owner sign in on this device (fire/js/app.js sets the flag). -->
    <a class="app fire" href="fire/" hidden>
      <div class="brand">
        <svg viewBox="0 0 32 32" aria-hidden="true"><path class="flame" d="M16 4.5c.8 4.6 7.5 7.6 7.5 15.2a7.5 7.5 0 0 1-15 0c0-4 2.2-6.7 4-8.4 0 2.6 1 4.2 2.4 4.9C14.6 12 14.3 8 16 4.5z"/><path class="core" d="M16 27.2a3.3 3.3 0 0 1-3.3-3.3c0-2.4 2.1-3.8 3.3-5.8 1.2 2 3.3 3.4 3.3 5.8a3.3 3.3 0 0 1-3.3 3.3z"/></svg>
        <div><h2>FIRE</h2><span class="sub">Financial Independence</span></div>
      </div>
      <p>Retire early.</p>
    </a>
    <!-- Kiddo Draw is private too: hidden unless its app has seen the owner sign in on this device (christmas/js/app.js sets the flag). -->
    <a class="app xmas" href="christmas/" hidden>
      <div class="brand">
        <svg viewBox="0 0 32 32" aria-hidden="true"><rect class="box" x="7" y="14.5" width="18" height="12.5" rx="1.5"/><rect class="lid" x="5.5" y="10.5" width="21" height="5" rx="1.5"/><rect class="ribbon" x="14.5" y="10.5" width="3" height="16.5"/><path class="ribbon" d="M16 10.5c-1.4-3.6-6.2-4.6-6.2-1.8 0 1.8 3.4 1.8 6.2 1.8zM16 10.5c1.4-3.6 6.2-4.6 6.2-1.8 0 1.8-3.4 1.8-6.2 1.8z"/></svg>
        <div><h2>Kiddo Draw</h2><span class="sub">Christmas</span></div>
      </div>
      <p>Who shops for whom.</p>
    </a>
  </div>
</main>
<script>
  // Private cards, each with the flag its app sets on a device where the owner has signed in.
  const privateCards = [['.app.fire', 'vsapps.fireOwner'], ['.app.xmas', 'vsapps.xmasOwner']].map(([sel, flag]) => {
    const card = document.querySelector(sel);
    try { if (localStorage.getItem(flag)) card.hidden = false; } catch {}
    return card;
  });
  // The owner's way in on a new device: tap Welcome 5 times (each within 1.5 seconds of the last) to show them for this visit.
  let taps = 0, last = 0;
  document.querySelector('h1').addEventListener('click', () => {
    const now = Date.now();
    taps = now - last < 1500 ? taps + 1 : 1;
    last = now;
    if (taps >= 5) privateCards.forEach(c => { c.hidden = false; });
  });
</script>
</body>
</html>
