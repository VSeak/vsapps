<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Top Out</title>
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#F7F5F0" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#10131F" media="(prefers-color-scheme: dark)">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.2/dist/umd/supabase.js"></script>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<header class="top">
  <a class="brand" href="#/"><svg viewBox="0 0 32 32" aria-hidden="true"><path d="M2.5 28 8 16.5l4.5-3.5 3.5 2 4.5-6 4 4.5L29.5 28z" fill="currentColor"/><path d="M20.5 9V2.5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/><path d="M21.4 2.6 27 4.4l-5.6 1.9z" class="flag"/></svg><span class="brand-text"><b class="brand-name"></b><small class="brand-sub"></small></span></a>
  <div class="who" hidden><span id="whoName"></span><span id="whoRoles"></span></div>
  <button id="signOut" class="ghost small" hidden>Sign Out</button>
</header>
<div id="installBar" hidden><img src="apple-touch-icon.png" alt=""><p></p>
  <div class="install-btns"><button type="button" class="ghost small" data-install="later">Not Now</button><button type="button" class="primary small" data-install="go" hidden>Install</button></div></div>
<main id="app"></main>
<div id="flash" role="status" hidden></div>
<dialog id="dlg"></dialog>

<!-- Plain scripts, not modules: they share one global scope, in this order. boot() runs after the last one. -->
<script src="js/core.js"></script>
<script src="js/app.js"></script>
<script src="js/location.js"></script>
<script src="js/calendar.js"></script>
<script src="js/member.js"></script>
<script src="js/checkins.js"></script>
<script src="js/summary.js"></script>
<script src="js/practices.js"></script>
<script src="js/exits.js"></script>
<script src="js/admin.js"></script>
<script>boot();</script>
</body>
</html>
